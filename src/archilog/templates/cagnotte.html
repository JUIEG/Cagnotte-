<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cagnotte - {{ cagnotte.nom }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Cagnotte: {{ cagnotte.nom }}</h1>

    <h2>Ajouter une dépense</h2>
    <form action="/ajouter" method="post">
        <input type="hidden" name="cagnotte" value="{{ cagnotte.nom }}">
        <input name="nom" placeholder="Participant" required>
        <input type="number" step="0.01" name="montant" placeholder="Montant" required>
        <input type="date" name="date_depense" value="{{ today }}">
        <button type="submit">Ajouter</button>
    </form>

    <h2>Dépenses</h2>
    <table border="1">
        <tr>
            <th>Participant</th>
            <th>Montant</th>
            <th>Date</th>
        </tr>
        {% for depense in depenses %}
        <tr>
            <td>{{ depense.participant }}</td>
            <td>{{ depense.montant }} €</td>
            <td>{{ depense.date }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3">Aucune dépense pour cette cagnotte.</td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="/">Retour à l'accueil</a></p>
</body>
</html>
